# Render Blueprint - one-click deploy of the VIT Bhopal VTOP MCP connector.
# In Render: New + > Blueprint, point it at this repo. Render builds the
# Dockerfile and gives you a public HTTPS URL; the connector endpoint is
# that URL + /mcp.
services:
  - type: web
    name: vtop-mcp
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    # VTOP is hosted in India (both A records are Indian: 182.76.192.117 and
    # 14.99.16.249 in ap-south-1). Render's default region is Ohio, and from
    # there every request to VTOP is dropped - the TCP connection never
    # completes, 120 seconds of silence, while the same request from a
    # residential Indian connection returns in ~1.2s.
    #
    # Singapore egress is far closer. This tests whether the drop is
    # geographic rather than a blanket "datacenter IPs" policy. If it still
    # times out from here, the block is IP-class based and no cloud region will
    # help - see docs/http-connector.md.
    region: singapore
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      # ---------------------------------------------------------------------
      # Bhopal, NOT Chennai. This was pointing at vtopcc.vit.ac.in upstream and
      # was never updated for this fork - deploying it as shipped would have
      # scraped VIT Chennai and returned nothing useful.
      # ---------------------------------------------------------------------
      - key: VTOP_BASE_URL
        value: https://vtop.vitbhopal.ac.in/vtop

      # Fail reasonably fast. VTOP answers in ~1.2s from a working network, so
      # a long timeout only makes a blocked connection painful to diagnose.
      - key: VTOP_TIMEOUT_MS
        value: "60000"

      # ---------------------------------------------------------------------
      # REQUIRED on any platform that routes in from another host.
      # The server binds 127.0.0.1 by default so that it is NOT reachable from
      # your home network when you run it behind a local tunnel. Render
      # connects from outside the container, so without this the deploy
      # succeeds and every request fails to connect.
      # ---------------------------------------------------------------------
      - key: VTOP_HTTP_BIND
        value: 0.0.0.0

      # ---------------------------------------------------------------------
      # Multi-user mode: generate a random secret so /register mints per-user
      # connector tokens. With this set, /mcp REQUIRES a valid token on every
      # request - which is what you want on a public URL. Without it the
      # instance is single-user and serves anyone who finds the address.
      #
      # Record the generated value. Changing it later invalidates every
      # connector link at once and everyone re-registers.
      # ---------------------------------------------------------------------
      - key: CONNECTOR_SECRET
        generateValue: true

      # ---------------------------------------------------------------------
      # CORS is OFF by default, which is correct: Claude's connector calls this
      # server from Anthropic's cloud and sends no Origin header. Only set this
      # if you need the browser-based MCP Inspector, e.g.
      #   VTOP_HTTP_CORS_ORIGIN=http://localhost:6274
      # ---------------------------------------------------------------------
      # - key: VTOP_HTTP_CORS_ORIGIN
      #   value: http://localhost:6274

      # ---------------------------------------------------------------------
      # OPTIONAL: persist encrypted sessions across restarts so users skip
      # captcha + login after a spin-down. Free tiers idle out after ~15 min
      # while VTOP's own session timeout is ~20, so a persisted session can
      # usually survive the gap.
      #
      # NOT READY OUT OF THE BOX: the Dockerfile installs with
      # `npm ci --omit=dev` and ioredis is not a runtime dependency, so the
      # import fails and persistence is silently skipped (the server logs a
      # warning and carries on without it). To use REDIS_URL, add ioredis to
      # dependencies and rebuild - or run the npm image instead of Docker.
      # ---------------------------------------------------------------------
      # - key: REDIS_URL
      #   sync: false            # set the value in the Render dashboard (secret)
      # - key: SESSION_KEEPALIVE_MS
      #   value: "600000"        # in-process timer (only fires while awake)

      # ---------------------------------------------------------------------
      # OPTIONAL: secrets-gated operator routes. Without these the routes
      # return 404, so they are invisible to the public.
      # ---------------------------------------------------------------------
      # - key: KEEPALIVE_TOKEN
      #   sync: false            # gates /keepalive/<token> for an external cron
      # - key: STATS_TOKEN
      #   sync: false            # gates the /stats/<token> usage dashboard
