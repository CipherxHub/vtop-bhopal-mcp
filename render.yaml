# Render Blueprint — one-click deploy of the VtopMCP ChatGPT connector.
# In Render: New + > Blueprint, point it at this repo. Render builds the
# Dockerfile and gives you a public HTTPS URL; the connector endpoint is
# that URL + /mcp.
services:
  - type: web
    name: vtop-mcp
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /
    autoDeploy: true
    envVars:
      # Render injects PORT automatically; the server reads it.
      - key: VTOP_BASE_URL
        value: https://vtopcc.vit.ac.in/vtop
      # --- Multi-user mode (optional): set a long random secret to enable
      # per-user connector links at /register. Leave unset for single-user.
      # - key: CONNECTOR_SECRET
      #   generateValue: true
      # --- Fewer logins (optional): persist encrypted sessions across restarts
      # so users skip captcha+login after a redeploy / spin-down. Needs
      # CONNECTOR_SECRET and a Redis URL (e.g. Upstash free tier). See README.
      # - key: REDIS_URL
      #   sync: false            # set the value in the Render dashboard (secret)
      # - key: SESSION_KEEPALIVE_MS
      #   value: "600000"        # in-process timer (only fires while awake)
      # --- Keep sessions alive for days (recommended): set a secret, then point
      # an external cron at /keepalive/<KEEPALIVE_TOKEN> every ~10 min. Needs REDIS_URL.
      # - key: KEEPALIVE_TOKEN
      #   sync: false            # set the secret value in the Render dashboard
      # --- Private usage dashboard (optional): set a secret to view stats at
      # /stats/<STATS_TOKEN> (unique users by reg number). Needs REDIS_URL.
      # - key: STATS_TOKEN
      #   sync: false            # set the secret value in the Render dashboard
